name: drift

# Compares this plugin's tool table with the newest browse release's own tools/list. A failure means browse shipped a
# tool, removed one, or changed an annotation: classify it in src/browse-tools.ts, re-capture the fixture, and re-pin.
# Weekly and on demand; it downloads one 63 MB Linux binary and never touches a browser, a relay or an extension.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch the newest stable Linux binary
        run: |
          set -euo pipefail
          node scripts/fetch-latest.mjs --target linux-x64 --out "$RUNNER_TEMP/browse"
          echo "pinned: $(node -p 'require("./manifest/browse.json").version')"
      - name: Compare its tools/list with the table
        run: node scripts/check-browse-tools.mjs --bin "$RUNNER_TEMP/browse"
