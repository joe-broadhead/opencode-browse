name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    # The 4a runner rule: the org's public self-hosted runner when `CI_RUNNER_PUBLIC` is set, otherwise GitHub's.
    # Every step is user-space (`npm ci`, the pinned binary download, `chmod`, the check), so the job runs there unchanged.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun inside stock OpenCode 2.4.1
          no-cache: true
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and an older lock records its GitHub dependency over ssh; a runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      # dist/ is committed: a source change without a rebundle fails here, before the rest of the gate.
      - name: The committed dist/ is current
        run: npm run bundle && git diff --exit-code -- dist
      # The plugin's own host and pack tests run the real server: fetch and verify this runner's pinned binary.
      - name: Fetch and verify this runner's pinned browse binary
        run: npm run bin:ensure
      # Some self-hosted runners check out with core.fileMode off; the packaged wrapper must stay executable.
      - name: Restore the MCP wrapper's executable bit
        run: chmod +x bin/mcp.mjs
      # The plugin's own typecheck, bundle, unit and pack tests, then plugin-kit check (conformance T0/T1, docs drift,
      # forbidden patterns, no bundled kit).
      - run: npm run check
