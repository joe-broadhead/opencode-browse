name: release

# Publishes the tag's build. The lead cuts the tag with `npx plugin-kit release <version>` on a master commit CI passed.
# The `check` job re-runs the full check on that commit with a read-only token; the `native` job builds the tag's four
# platform gzips, verifies them against manifest/native.json and attests them; only `publish` holds a contents write
# token, so repository and dependency code never runs with one. The release carries the packed tarball, the conformance report,
# SHA256SUMS, the four browse-<platform>.gz files, LICENSE.browse and the tag-time native.json.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Fetch the contract over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      # dist/ is committed: the tag must carry the same build its sources make.
      - name: The committed dist/ is current
        run: npm run bundle && git diff --exit-code -- dist
      - run: chmod +x bin/mcp.mjs
      - run: npm run check
      - name: The tag names this package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG"
      - name: Pack, conformance report and sums
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npx plugin-kit check --json > "$RUNNER_TEMP/release/conformance.json"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum ./*.tgz conformance.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  native:
    name: build and verify the native files
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the tag's native files
        run: node scripts/build-native.mjs --release "$RUNNER_TEMP/native" --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Verify the native files against manifest/native.json
        run: node scripts/verify-native.mjs --built "$RUNNER_TEMP/native" --committed manifest/native.json --out "$RUNNER_TEMP/native-files" --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Attest the native files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/native-files/*.gz
            ${{ runner.temp }}/native-files/LICENSE.browse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-files
          path: ${{ runner.temp }}/native-files
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [check, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-files
          path: ${{ runner.temp }}/native-files
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-files"
          native="$RUNNER_TEMP/native-files"
          gh release create "${GITHUB_REF_NAME}" ./*.tgz conformance.json SHA256SUMS \
            "$native/browse-darwin-arm64.gz" \
            "$native/browse-darwin-x64.gz" \
            "$native/browse-linux-arm64-gnu.gz" \
            "$native/browse-linux-x64-gnu.gz" \
            "$native/LICENSE.browse" \
            "$native/native.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
