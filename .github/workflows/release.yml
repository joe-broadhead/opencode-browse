name: release

# Publishes the tag's build. The lead cuts the tag with `npx plugin-kit release <version>` on a master commit CI passed;
# this workflow checks that commit again, packs it, and creates the GitHub release with the tarball and its SHA256SUMS.
# The native browse binary's release assets are built by native.yml; attaching them is the release owner's step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: npm ci --ignore-scripts
      - run: npm run bin:ensure
      - run: chmod +x bin/mcp.mjs
      - run: npm run check
      - name: Pack, sum, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum ./*.tgz > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" ./*.tgz SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --generate-notes
