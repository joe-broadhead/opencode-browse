name: release

# Publishes the tag's build. The lead cuts the tag with `npx plugin-kit release <version>` on a master commit CI passed.
# The `check` job re-runs the full check on that commit with a read-only token; only `publish` holds a write token, so
# repository and dependency code never runs with one. The release carries the packed tarball, the conformance report and
# SHA256SUMS. The native browse binary's assets are built by native.yml, and attaching them, the owner's approval and the
# stock-host `opencode plugin add` check are the release owner's steps.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Fetch the contract over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      # dist/ is committed: the tag must carry the same build its sources make.
      - name: The committed dist/ is current
        run: npm run bundle && git diff --exit-code -- dist
      - run: npm run bin:ensure
      - run: chmod +x bin/mcp.mjs
      - run: npm run check
      - name: Pack, conformance report and sums
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npx plugin-kit check --json > "$RUNNER_TEMP/release/conformance.json"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum ./*.tgz conformance.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    name: publish the release
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-files"
          gh release create "${GITHUB_REF_NAME}" ./*.tgz conformance.json SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
